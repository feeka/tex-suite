name: Build desktop releases

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            runner: windows-latest
            args: --win nsis --x64
            artifact: windows-x64
          - label: macOS Intel
            runner: macos-15-intel
            args: --mac dmg --x64
            artifact: macos-x64
          - label: macOS Apple silicon
            runner: macos-15
            args: --mac dmg --arm64
            artifact: macos-arm64
          - label: Linux x64
            runner: ubuntu-22.04
            args: --linux AppImage deb --x64
            artifact: linux-x64
          - label: Linux ARM64
            runner: ubuntu-24.04-arm
            args: --linux AppImage deb --arm64
            artifact: linux-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/verify-release.mjs
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Require macOS distribution credentials
        if: startsWith(matrix.label, 'macOS')
        shell: bash
        env:
          CSC_LINK: ${{ startsWith(matrix.label, 'macOS') && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ startsWith(matrix.label, 'macOS') && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ startsWith(matrix.label, 'macOS') && secrets.MAC_APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ startsWith(matrix.label, 'macOS') && secrets.MAC_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ startsWith(matrix.label, 'macOS') && secrets.MAC_APPLE_TEAM_ID || '' }}
        run: |
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing $name; refusing to publish an unsigned macOS app."
              exit 1
            fi
          done
      - name: Build installer
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_LINK: ${{ startsWith(matrix.label, 'macOS') && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ startsWith(matrix.label, 'macOS') && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ startsWith(matrix.label, 'macOS') && secrets.MAC_APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ startsWith(matrix.label, 'macOS') && secrets.MAC_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ startsWith(matrix.label, 'macOS') && secrets.MAC_APPLE_TEAM_ID || '' }}
      - name: Verify macOS signature and notarization
        if: startsWith(matrix.label, 'macOS')
        shell: bash
        run: |
          app=$(find release-v039 -maxdepth 2 -name 'TeX Suite.app' -type d -print -quit)
          test -n "$app" || { echo '::error::App bundle missing'; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=4 "$app"
          xcrun stapler validate "$app"
      - uses: actions/upload-artifact@v4
        with:
          name: tex-suite-${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            release-v039/*.exe
            release-v039/*.dmg
            release-v039/*.AppImage
            release-v039/*.deb

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: tex-suite-*
          path: release-assets
          merge-multiple: true
      - name: Verify release files
        run: node scripts/verify-assets.mjs release-assets
      - name: Generate checksums
        run: cd release-assets && sha256sum *.exe *.dmg *.AppImage *.deb > SHA256SUMS.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* --title "TeX Suite $GITHUB_REF_NAME" --generate-notes --verify-tag
          fi
