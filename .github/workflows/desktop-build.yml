name: Build desktop releases

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            runner: windows-latest
            args: --win nsis --x64
            artifact: windows-x64
          - label: Linux x64
            runner: ubuntu-22.04
            args: --linux AppImage deb --x64
            artifact: linux-x64
          - label: Linux ARM64
            runner: ubuntu-24.04-arm
            args: --linux AppImage deb --arm64
            artifact: linux-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/verify-release.mjs
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Install browser for UI tests
        if: runner.os == 'Windows'
        run: npx playwright install chromium
      - name: Test editor UI
        if: runner.os == 'Windows'
        run: npx playwright test
      - name: Build installer
        run: npx electron-builder ${{ matrix.args }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: tex-suite-${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            release-v039/*.exe
            release-v039/*.AppImage
            release-v039/*.deb

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: tex-suite-*
          path: release-assets
          merge-multiple: true
      - name: Verify release files
        run: node scripts/verify-assets.mjs release-assets
      - name: Generate checksums
        run: cd release-assets && sha256sum *.exe *.AppImage *.deb > SHA256SUMS.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* --title "TeX Suite $GITHUB_REF_NAME (Windows and Linux)" --notes "Windows x64 and Linux x64/ARM64 installers. macOS is not included because signed and notarized builds are not yet available. Verify downloads with SHA256SUMS.txt." --verify-tag
          fi
